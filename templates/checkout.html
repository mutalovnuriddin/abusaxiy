{% extends 'base.html' %}
{% block content %}
{% load i18n %}

<div class="container" style="padding: 100px 0 60px 0;">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card p-4 shadow-sm" style="border-radius: 12px;">
        <h4 class="fw-bold mb-3">{% trans "Buyurtmani rasmiylashtirish" %}</h4>
        
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label font-weight-bold">{% trans "Yetkazib berish manzili" %}</label>
            <textarea name="address" class="form-control" rows="3" placeholder="{% trans 'Toshkent sh., Yunusobod t., 4-mavze...' %}" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label font-weight-bold">{% trans "Telefon raqamingiz" %}</label>
            <input type="text" name="phone" value="{{ request.user.phone_number|default:'' }}" class="form-control" placeholder="+998901234567" required>
          </div>

          <div class="d-flex justify-content-between my-3">
            <span>{% trans "Jami to'lov" %}:</span>
            <strong class="text-danger fs-5">${{ total_price }}</strong>
          </div>

          <button type="submit" class="btn w-100 text-white fw-bold" style="background-color: #f33f3f; padding: 12px;">
            {% trans "Buyurtmani tasdiqlash" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
