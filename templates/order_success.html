{% extends 'base.html' %}
{% block content %}
{% load i18n %}

<div class="container text-center" style="padding: 120px 0 80px 0;">
  <div style="display: flex; align-items: center; justify-content: center;" class="card p-5 shadow-sm mx-auto" style="max-width: 500px; border-radius: 12px;">
    <i class="fa fa-check-circle text-success" style="font-size: 70px;"></i>
    <h3 class="fw-bold mt-3">{% trans "Rahmat!" %}</h3>
    <p class="text-muted mt-2">{% trans "Buyurtmangiz adminlarga muvaffaqiyatli yuborildi. Tez orada siz bilan bog'lanamiz!" %}</p>
    <h5 class="text-danger fw-bold my-2">{% trans "Buyurtma ID" %}: #{{ order.id }}</h5>
    <a href="{% url 'home' %}" class="btn mt-3 text-white fw-bold" style="background-color: #f33f3f;">
      {% trans "Bosh sahifaga qaytish" %}
    </a>
  </div>
</div>

{% endblock %}
